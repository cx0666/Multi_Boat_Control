# Custom ROS Console Configuration for Multi-Boat Control System
# 多艇控制系统自定义日志配置

# Log level settings
# FATAL, ERROR, WARN, INFO, DEBUG

# Global log level
log4j.logger.ros=INFO

# Package-specific log levels
log4j.logger.ros.multi_boat_control=INFO

# Node-specific log levels  
log4j.logger.ros.multi_boat_control.rtk_node=INFO
log4j.logger.ros.multi_boat_control.state_estimator_node=INFO
log4j.logger.ros.multi_boat_control.sensor_diagnostic=INFO

# For debugging, uncomment these lines:
# log4j.logger.ros.multi_boat_control.rtk_node=DEBUG
# log4j.logger.ros.multi_boat_control.state_estimator_node=DEBUG

# Console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=[%d{HH:mm:ss.SSS}] [%c{1}] [%p]: %m%n